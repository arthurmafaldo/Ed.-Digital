<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrinho - Inovações no Campo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos básicos para centralizar e ajustar as imagens no site */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-top: 20px;
        }

        .card-imagem {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            border: 1px solid #1a232a;
        }

        .card-imagem img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <h1 style="text-align: center; margin-bottom: 10px;">Inovações do Agro no Paraná</h1>
    </header>

    <main class="container">
        <div class="card-imagem">
            <img src="1.png" alt="Inovações do Agro no Paraná - Tecnologia, sustentabilidade e alta produtividade no campo">
        </div>

        <div class="card-imagem">
            <img src="2.png" alt="Agrotec 2026: Inovação cooperativista no norte do Paraná">
        </div>
    </main>

</body>
</html>
